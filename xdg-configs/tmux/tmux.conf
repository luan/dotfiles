# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'sainnhe/tmux-fzf'

# Inlined from tmux-sensible (removed)
set -g focus-events on

set -s extended-keys on
set -g extended-keys-format csi-u
run-shell "tmux set-environment -g PATH \"$HOME/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin\""

# Custom CSI sequences from WezTerm relay (must register before binding)
set -s user-keys[0] "\033[60~"   # Ctrl+Tab     → toggle last session
set -s user-keys[2] "\033[62~"   # Cmd+N       → new session
set -s user-keys[3] "\033[63~"   # Cmd+P       → session chooser
set -s user-keys[4] "\033[64~"   # Cmd+Shift+N → session next
set -s user-keys[5] "\033[65~"   # Cmd+Shift+P → session prev
set -s user-keys[9] "\033[69~"   # Ctrl+Alt+[  → copy mode
set -s user-keys[10] "\033[70~"  # Cmd+Shift+] → session next (alt)
set -s user-keys[11] "\033[71~"  # Cmd+Y       → copy mode
set -s user-keys[12] "\033[72~"  # Cmd+C       → copy-mode copy selection
set -s user-keys[13] "\033[73~"  # Cmd+Shift+[ → session prev (alt)
set -s user-keys[16] "\033[76~"  # Ctrl+Shift+Tab → toggle last session

# Popup styling
set -g @popup_bg '#1A1B26'
set -g @popup_border '#292E42'

# Native tmux status bar
set -g status-position top
set -g status-style 'bg=#11111b,fg=#cdd6f4'
set -g status-left-length 40
set -g status-left '#[fg=#89b4fa,bold] #S '
set -g status-right '#[fg=#6c7086]%H:%M '
set -g window-status-format '#[fg=#6c7086] #I:#W '
set -g window-status-current-format '#[fg=#89b4fa,bold] #I:#W '
set -g status-interval 5

# Remove state and hooks from the retired custom status/session helper.
set -gu @notched
set -gu @two_row_status
set -gu @notch_width
set -gu @mux_win
set -gu @mux_left
set -gu @sysinfo
set -gu @terminal_sidebar_width
set-hook -gu client-session-changed
set-hook -gu session-created
set-hook -gu session-closed
set-hook -gu session-renamed
set-hook -gu client-resized
set-hook -gu session-window-changed
set-hook -gu after-new-window
set-hook -gu after-rename-window
set-hook -gu window-unlinked
unbind-key -n User1
unbind-key -n User6
unbind-key -n User7
unbind-key -n User8
unbind-key X
set -gq allow-passthrough on
# Do not let tmux native alert/activity state style the status bar.
set -g bell-action none
set -g activity-action none
set -g monitor-bell off
set -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -gw window-status-activity-style default
set -gw window-status-bell-style default

# Terminal: use tmux's standard terminfo inside panes. Fresh macOS machines often
# don't have xterm-ghostty installed, and missing pane terminfo causes janky
# redraw/rendering in line editors and TUIs.
set -g default-terminal "tmux-256color"

set-window-option -g window-size smallest

set -g base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard

set -g window-style "bg=#171823"
set -g window-active-style "bg=#1a1b26"

# Catppuccin Mocha pane borders
set -g pane-active-border-style 'bg=#1a1b26 fg=#1a1b26'
set -g pane-border-style 'bg=#1a1b26 fg=#1a1b26'

# Use vim keybindings in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind -T copy-mode-vi User12 send -X copy-pipe-and-cancel 'pbcopy'             # Cmd+C → copy to system clipboard

set -g @fzf-url-fzf-options '--tmux 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set-option -g prefix C-space

bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind = choose-buffer -F "#{buffer_size} bytes: #{=60:buffer_sample}"
# Rename session in the command prompt
bind r command-prompt -I "#S" -p "Rename session:" "rename-session '%%'"

# Unprefixed {{{
  bind -n M-\\ setw synchronize-panes
  bind -n M-C send-keys -R \; clear-history

# Session and window shortcuts
bind-key -n User0 switch-client -l
bind-key -n M-H select-pane -L
bind-key -n M-J select-pane -D
bind-key -n M-K select-pane -U
bind-key -n M-L select-pane -R
bind-key -n M-O select-pane -t :.+

bind-key -n M-N next-window
bind-key -n M-P previous-window
bind-key -n 'M-}' next-window
bind-key -n 'M-{' previous-window
bind-key -n User2 new-session
bind-key -n User3 choose-tree -s
bind-key -n User4 switch-client -n
bind-key -n User5 switch-client -p
bind-key -n User9 copy-mode
bind-key -n User10 switch-client -n
bind-key -n User13 switch-client -p
bind-key -n User11 copy-mode
bind-key -n User16 switch-client -l
bind-key -n C-M-] paste-buffer
bind-key -n M-X confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key -n M-Z resize-pane -Z
bind-key -n M-Tab last-window
bind-key -n M-R source-file ~/.config/tmux/tmux.conf

# Window selection by index (Alt+N)
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8

# Keep prefix-number selection native to tmux.
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2
bind-key 3 select-window -t :3
bind-key 4 select-window -t :4
bind-key 5 select-window -t :5
bind-key 6 select-window -t :6
bind-key 7 select-window -t :7
bind-key 8 select-window -t :8
bind-key 9 select-window -t :9
bind-key -n M-9 select-window -t :9

# Swap window left/right (Alt+Shift+,/.)
bind-key -n M-< 'swap-window -t -1; select-window -t -1'
bind-key -n M-> 'swap-window -t +1; select-window -t +1'

# Session chooser (prefix+s)
bind s choose-tree -s
# Swap window left/right (prefix+</>)
bind < 'swap-window -t -1; select-window -t -1'
bind > 'swap-window -t +1; select-window -t +1'
# }}}

# Mouse mode {{{
  set -g mouse on
  bind   -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
  bind   -n WheelDownPane select-pane -t= \; send-keys -M
  bind   -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
  bind   -T copy-mode-vi C-WheelUpPane   send -X scroll-up
  bind   -T copy-mode-vi C-WheelDownPane send -X scroll-down
  bind   -T copy-mode    C-WheelUpPane   send -X scroll-up
  bind   -T copy-mode    C-WheelDownPane send -X scroll-down
  unbind -T copy-mode    MouseDragEnd1Pane

  # What counts as a "word" for select-word: tmux's default separator set is
  # every printable ASCII symbol except '_', so double-clicking a URL or a path
  # picks out one fragment ("github") instead of the whole thing. Keep + - . / :
  # @ \ ~ as word characters so URLs, paths and user@host select in one click.
  set -g word-separators "!\"#$%&'()*,;<=>?[]^`{|}"

  # Selection like a normal terminal: double-click picks a word, triple-click a
  # line, dragging from either extends by whole words/lines, and the selection
  # stays highlighted until you click again or press Escape. No copy on select —
  # Cmd+C (User12) copies. tmux can only hold a selection while the pane is in
  # copy mode, so none of these cancel the mode.
  #
  # SecondClick, not DoubleClick, does the work: tmux delays DoubleClick by the
  # click timeout (~300ms) while it waits for a possible third click, far too
  # late to seed a double-click-drag.
  bind   -T root SecondClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -H ; send -X select-word'
  bind   -T root TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -H ; send -X select-line'
  bind   -T root DoubleClick1Pane if -F '#{mouse_any_flag}' 'send -M'

  bind   -T copy-mode-vi SecondClick1Pane   select-pane \; send -X select-word
  bind   -T copy-mode-vi TripleClick1Pane   select-pane \; send -X select-line
  # Fires ~300ms after SecondClick already selected; acting on it would collapse
  # a drag in progress back to a single word.
  bind   -T copy-mode-vi DoubleClick1Pane   select-pane
  # Must stay bound: with MouseDragEnd1Pane unbound, releasing a drag exits copy
  # mode and drops the selection. stop-selection finalises it and keeps it up.
  bind   -T copy-mode-vi MouseDragEnd1Pane  send -X stop-selection
  # A plain click drops the selection, like clicking in a terminal.
  bind   -T copy-mode-vi MouseDown1Pane     select-pane \; send -X clear-selection
# }}}

run "~/.tmux/plugins/tpm/tpm"
