[tools]
cargo-binstall = "latest"
"cargo:cargo-xwin" = "latest"
cmake = "latest"
"github:kunobi-ninja/kache" = "2.0.0-rc.3"

rust = { version = "nightly", profile = "minimal", components = ["rustfmt", "clippy", "rust-analyzer"] }
"github:voidzero-dev/vite-plus" = { version = "latest", postinstall = '"$MISE_TOOL_INSTALL_PATH/vp" env setup --refresh', install_env = { VP_SELF_SETUP_NO_MODIFY_PATH = "1", VP_NODE_MANAGER = "yes", VP_PM_MANAGER = "yes" } }

[env]
# Keep machine-specific CMake toolchains in a local config or environment.
CC_KNOWN_WRAPPER_CUSTOM = "kache"
CMAKE_C_COMPILER_LAUNCHER = ""
CMAKE_CXX_COMPILER_LAUNCHER = ""
HOST_CC = "kache cc"
HOST_CXX = "kache c++"

[settings]
# Interactive activation uses tool paths; Vite+ owns the JavaScript shims.
activate_shims = false
disable_tools = ["sccache"]

[settings.github]
credential_command = "gh auth token"
